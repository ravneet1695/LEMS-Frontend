<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-shield-lock"></i> Reset Password</h2>
            <p>Create a strong new password for your account</p>
        </div>

        <div *ngIf="error" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>

        <div *ngIf="success" class="alert alert-success">
            <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
            <p class="mb-0 mt-2"><small>Redirecting to login...</small></p>
        </div>

        <form (ngSubmit)="onSubmit()" *ngIf="!success && resetToken">
            <!-- New Password -->
            <div class="form-floating mb-2 position-relative">
                <input [type]="showPassword ? 'text' : 'password'" class="form-control" id="newPassword"
                    [(ngModel)]="newPassword" (ngModelChange)="onPasswordChange()" name="newPassword"
                    placeholder="New Password" required [disabled]="loading">
                <label for="newPassword"><i class="bi bi-lock"></i> New Password</label>
                <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2"
                    (click)="togglePasswordVisibility()" style="border: none; background: transparent;">
                    <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
            </div>

            <!-- Password Strength Indicators -->
            <div class="password-requirements mb-3" *ngIf="newPassword">
                <small class="d-block mb-1 fw-bold">Password must contain:</small>
                <small class="d-block" [class.text-success]="passwordStrength.hasMinLength"
                    [class.text-muted]="!passwordStrength.hasMinLength">
                    <i [class]="passwordStrength.hasMinLength ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
                    At least 8 characters
                </small>
                <small class="d-block" [class.text-success]="passwordStrength.hasUpperCase"
                    [class.text-muted]="!passwordStrength.hasUpperCase">
                    <i [class]="passwordStrength.hasUpperCase ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
                    One uppercase letter
                </small>
                <small class="d-block" [class.text-success]="passwordStrength.hasLowerCase"
                    [class.text-muted]="!passwordStrength.hasLowerCase">
                    <i [class]="passwordStrength.hasLowerCase ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
                    One lowercase letter
                </small>
                <small class="d-block" [class.text-success]="passwordStrength.hasNumber"
                    [class.text-muted]="!passwordStrength.hasNumber">
                    <i [class]="passwordStrength.hasNumber ? 'bi bi-check-circle-fill' : 'bi bi-circle'"></i>
                    One number
                </small>
            </div>

            <!-- Confirm Password -->
            <div class="form-floating mb-3 position-relative">
                <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control" id="confirmPassword"
                    [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required
                    [disabled]="loading">
                <label for="confirmPassword"><i class="bi bi-lock-fill"></i> Confirm Password</label>
                <button type="button" class="btn btn-sm position-absolute end-0 top-50 translate-middle-y me-2"
                    (click)="toggleConfirmPasswordVisibility()" style="border: none; background: transparent;">
                    <i [class]="showConfirmPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loading || !isPasswordValid()">
                <span *ngIf="!loading">
                    <i class="bi bi-check-circle"></i> Reset Password
                </span>
                <span *ngIf="loading">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    Resetting...
                </span>
            </button>

            <div class="text-center">
                <a routerLink="/auth/login" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </form>

        <div *ngIf="!resetToken" class="text-center">
            <p class="text-danger mb-3">Invalid or missing reset token</p>
            <a routerLink="/auth/forgot-password" class="btn btn-outline-primary">
                <i class="bi bi-envelope"></i> Request New Reset Link
            </a>
        </div>
    </div>
</div>
