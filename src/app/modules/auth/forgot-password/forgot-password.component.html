<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h2><i class="bi bi-key"></i> Forgot Password</h2>
            <p>Enter your email address and we'll send you a link to reset your password</p>
        </div>

        <div *ngIf="error" class="alert alert-danger">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
        </div>

        <div *ngIf="success" class="alert alert-success">
            <i class="bi bi-check-circle-fill me-2"></i>{{ success }}
        </div>

        <form (ngSubmit)="onSubmit()" *ngIf="!success">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="Email"
                    required [disabled]="loading">
                <label for="email"><i class="bi bi-envelope"></i> Email Address</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3" [disabled]="loading">
                <span *ngIf="!loading">
                    <i class="bi bi-send"></i> Send Reset Link
                </span>
                <span *ngIf="loading">
                    <span class="spinner-border spinner-border-sm me-2"></span>
                    Sending...
                </span>
            </button>

            <div class="text-center">
                <a routerLink="/auth/login" class="text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Login
                </a>
            </div>
        </form>

        <div *ngIf="success" class="text-center">
            <a routerLink="/auth/login" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>
